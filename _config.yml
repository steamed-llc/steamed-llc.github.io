remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"
plugins:
- jekyll-remote-theme
- jekyll-include-cache
title: STEAMEd™
name: STEAM Education Supply, LLC
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - compose.yaml
atom_feed:
  hide: true
footer:
  links:
    - label: "Home"
      icon: "fas fa-fw fa-home"
      url: "/"
    - label: "Contact"
      icon: "fas fa-fw fa-envelope"
      url: "/contact/"
    - label: "Privacy"
      icon: "fas fa-fw fa-shield-alt"
      url: "/privacy/"
    - label: "Terms"
      icon: "fas fa-fw fa-file-contract"
      url: "/terms/"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/company/steamedus"